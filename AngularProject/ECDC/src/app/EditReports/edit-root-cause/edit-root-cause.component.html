
<div class="container mb-5" style="margin-top: 8%;">
  <div class="heading_container heading_center d-flex">
    <h2 class="mx-auto my-4">
      Edit Root Cause
    </h2>

  </div>

  <div class="row">
    <form [formGroup]="RootCauseForm" id="print-section" (ngSubmit)="submitData()"
      class="col-md-10 mx-auto d-flex flex-wrap">

      <table class="table">
        <tr>
          <td>
            <div class="form-group">
              <label class="form-label" for="name">Root Cause: </label>
              <input [(ngModel)]="RootCause.causeName" type="text" name="causeName" formControlName="causeName" id="causeName" class="form-control"/>
              <div *ngIf="causeName?.invalid && (causeName?.dirty || causeName?.touched)">
                <small class="text-danger" *ngIf="causeName?.errors?.['required']">
                  cause is required
                </small>
              </div>
            </div>
          </td>
        </tr>
      </table>

      <input type="submit" [disabled]="RootCauseForm.invalid" class="btn btn-success me-3" value="Update" />
      <!-- <input type="submit" class="btn btn-primary me-3" value="Export Data" (click)="Download()" /> -->
      <input routerLink="/Dashboard/RootCause" type="submit" class="btn btn-primary" value="Show Data">

    </form>
  </div>
</div>
