
<div class="container mb-5" style="margin-top: 8%;">
  <div class="heading_container heading_center d-flex">
    <h2 class="mx-auto my-4">
      Edit Observation
    </h2>

  </div>

  <div class="row">
    <form [formGroup]="CorrectiveObservationForm" id="print-section" (ngSubmit)="submitData()"
      class="col-md-10 mx-auto d-flex flex-wrap">

      <table class="table">
        <tr>
          <td>
            <div class="form-group">
              <label class="form-label" for="name">Observation: </label>
              <input [(ngModel)]="CorrectiveObservation.observation" type="text" name="observation" formControlName="observation" id="observation" class="form-control"/>
              <div *ngIf="observation?.invalid && (observation?.dirty || observation?.touched)">
                <small class="text-danger" *ngIf="observation?.errors?.['required']">
                  Observation is required
                </small>
              </div>
            </div>
          </td>
        </tr>
      </table>

      <input type="submit" [disabled]="CorrectiveObservationForm.invalid" class="btn btn-success me-3" value="Update" />
      <!-- <input type="submit" class="btn btn-primary me-3" value="Export Data" (click)="Download()" /> -->
      <input routerLink="/Dashboard/CorrectiveObservation" type="submit" class="btn btn-primary" value="Show Data">

    </form>
  </div>
</div>
