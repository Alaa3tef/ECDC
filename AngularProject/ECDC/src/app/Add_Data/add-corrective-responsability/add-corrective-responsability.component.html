<div class="container mb-5" style="margin-top: 8%;">
  <div class="heading_container heading_center d-flex">
    <h2 class="mx-auto my-4">
      Add Corrective Responsability
    </h2>

  </div>

  <div class="row">
    <form [formGroup]="CorrectiveResponsabilityForm" id="print-section" (ngSubmit)="submitData()"
      class="col-md-10 mx-auto d-flex flex-wrap">

      <table class="table">
        <tr>
          <td>
            <div class="form-group">
              <label class="form-label" for="name">Responsability : </label>
              <input type="text" name="responsibilityName" formControlName="responsibilityName" id="responsibilityName" class="form-control"/>
              <div *ngIf="responsibilityName?.invalid && (responsibilityName?.dirty || responsibilityName?.touched)">
                <small class="text-danger" *ngIf="responsibilityName?.errors?.['required']">
                  Responsability is required
                </small>
              </div>
            </div>
          </td>
        </tr>
      </table>

      <input type="submit" [disabled]="CorrectiveResponsabilityForm.invalid" class="btn btn-success me-3" value="Submit" />
      <!-- <input type="submit" class="btn btn-primary me-3" value="Export Data" (click)="Download()" /> -->
      <input routerLink="/Dashboard/CorrectiveResponsability" type="submit" class="btn btn-primary" value="Show Data">

    </form>
  </div>
</div>
