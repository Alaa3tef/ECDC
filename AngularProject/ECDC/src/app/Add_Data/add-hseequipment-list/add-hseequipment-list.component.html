<div class="container mb-5" style="margin-top: 8%;">
  <div class="heading_container heading_center d-flex">
    <h2 class="mx-auto my-4">
      Add HSE Equipment
    </h2>

  </div>

  <div class="row">
    <form [formGroup]="HSEEquipmentListForm" id="print-section" (ngSubmit)="submitData()"
      class="col-md-10 mx-auto d-flex flex-wrap">

      <table class="table">
        <tr>
          <td>
            <div class="form-group">
              <label class="form-label" for="equipment">Equipment: </label>
              <input type="text" name="equipment" formControlName="equipment" id="equipment" class="form-control"/>
              <div *ngIf="equipment?.invalid && (equipment?.dirty || equipment?.touched)">
                <small class="text-danger" *ngIf="equipment?.errors?.['required']">
                  Equipment is required
                </small>
              </div>
            </div>
          </td>
        </tr>
      </table>

      <input type="submit" [disabled]="HSEEquipmentListForm.invalid" class="btn btn-success me-3" value="Submit" />
      <!-- <input type="submit" class="btn btn-primary me-3" value="Export Data" (click)="Download()" /> -->
      <input routerLink="/Dashboard/HSEEquipmentList" type="submit" class="btn btn-primary" value="Show Data">

    </form>
  </div>
</div>
