<div class="container mb-5" style="margin-top: 8%;">
    <div class="heading_container heading_center d-flex">
      <h2 class="mx-auto my-4">
        Add Forklift
      </h2>
  
    </div>
  
    <div class="row">
      <form [formGroup]="ForkliftDailyReport" id="print-section" (ngSubmit)="submitData()"
        class="col-md-10 mx-auto d-flex flex-wrap">
  
        <table class="table">
          <tr>
            <td>
              <div class="form-group">
                <label class="form-label" for="forkName"> Forklift : </label>
                <input type="text" name="forkName" formControlName="forkName" id="forkName" class="form-control"/>
                <div *ngIf="forkName?.invalid && (forkName?.dirty || forkName?.touched)">
                  <small class="text-danger" *ngIf="forkName?.errors?.['required']">
                     Forklift is required
                  </small>
                </div>
              </div>
            </td>
            <td>
              <div class="form-group">
                <label class="form-label" for="type">Type : </label>
                <input type="text" name="forkType" formControlName="forkType" id="forkType" class="form-control"/>
                <div *ngIf="forkType?.invalid && (forkType?.dirty || forkType?.touched)">
                  <small class="text-danger" *ngIf="forkType?.errors?.['required']">
                     Type is required
                  </small>
                </div>
              </div>
            </td>
          </tr>
          <tr>
            <td>
              <div class="form-group">
                <label class="form-label" for="rigId">Capacity: </label>
                <input type="text" name="forkCapacity" formControlName="forkCapacity" id="forkCapacity" class="form-control"/>
                <div *ngIf="forkCapacity?.invalid && (forkCapacity?.dirty || forkCapacity?.touched)">
                  <small class="text-danger" *ngIf="forkCapacity?.errors?.['required']">
                     Capacity is required
                  </small>
                </div>
              </div>
            </td>
            <td>
              <div class="from-group">
                <label for="chasisNo" class="form-label">Chasis No:</label>
                <input type="number" name="forkChasisNo" formControlName="forkChasisNo" id="forkChasisNo" class="form-control"/>
                <div *ngIf="forkChasisNo?.invalid && (forkChasisNo?.dirty || forkChasisNo?.touched)">
                  <small class="text-danger" *ngIf="forkChasisNo?.errors?.['required']">
                     Chasis No is required
                  </small>
                </div>
              </div>
            </td>
          </tr>

          <tr>
            <td>
              <div class="form-group">
                <label class="form-label" for="rigId">Date Of Last Inspection: </label>
                <input type="date" name="forkDateofLastInspection" formControlName="forkDateofLastInspection" id="forkDateofLastInspection" class="form-control"/>
                <div *ngIf="forkDateofLastInspection?.invalid && (forkDateofLastInspection?.dirty || forkDateofLastInspection?.touched)">
                  <small class="text-danger" *ngIf="forkDateofLastInspection?.errors?.['required']">
                     Date Of Last Inspection is required
                  </small>
                </div>
              </div>
            </td>
            <td>
              <div class="from-group">
                <label for="dateofNextInspection" class="form-label">Date Of Next Inspection:</label>
                <input type="date" name="forkDateofNextInspection" formControlName="forkDateofNextInspection" id="forkDateofNextInspection" class="form-control"/>
                <div *ngIf="forkDateofNextInspection?.invalid && (forkDateofNextInspection?.dirty || forkDateofNextInspection?.touched)">
                  <small class="text-danger" *ngIf="forkDateofNextInspection?.errors?.['required']">
                    Date Of Next Inspection is required
                  </small>
                </div>
              </div>
            </td>

          </tr>
        </table>
  
        <input type="submit" class="btn btn-success me-3" value="Submit" />
        <!-- <input type="submit" class="btn btn-primary me-3" value="Export Data" (click)="Download()" /> -->
        <input routerLink="/Dashboard/ForkliftDailyReports" type="submit" class="btn btn-primary" value="Show Data">
  
      </form>
    </div>
  </div>
