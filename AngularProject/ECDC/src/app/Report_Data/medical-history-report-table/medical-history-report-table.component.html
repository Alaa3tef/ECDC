<div class="container mb-5" style="margin-top: 8%;">
    <div class="heading_container heading_center d-flex">
      <h2 class="mx-auto my-4">
        Medical History Report
      </h2>


    </div>
    <div class="d-flex justify-content-around my-4 ">

      <a routerLink="/MedicalHistory/Add" class="btn btn-primary me-2">Add New Medical History</a>
      <a (click)="Download()" class="btn btn-primary ">Export Data</a>
      <span style="width: 65% ;">
        <input list="Search" autocomplete="off" name="menace" class="form-control" placeholder="Search"
          (input)="SelectMenace($event)">
        <datalist id="Search">
            <option *ngFor="let menace of SearchList" [value]="menace"></option>
        </datalist>
      </span>
    </div>
    <table class="table table-striped text-center mt-2">
      <thead>
        <tr>
          <th>Rig</th>
          <th>Company</th>
          <th>Job</th>
          <th>Name</th>
          <th>Medical Issue</th>
          <th *ngIf="IsAdmin||IsUser">Actions</th>
        </tr>
      </thead>
      <tbody *ngFor="let record of (MedicalHistoryList | async)">
        <tr>
          <td>{{record.rigId}}</td>
          <td>{{record.company}}</td>
          <td>{{record.jop}}</td>
          <td >
            {{record.name}}
          </td>
          <td>{{recordContainsPoor(record) ? 'Yes' : 'No'}}</td>
          <td *ngIf="IsAdmin||IsUser">
            <a routerLink="/MedicalHistory/Edit/{{record.id}}/{{record.date}}" class="m-2 h4" style="color: #434F78;"><i
                class="fa-solid fa-pen-to-square"></i></a>
                <a routerLink="/PrintMedicalHistoryById/{{record.id}}" class="m-2 h4" style="color: #434F78;"><i class="fa-solid fa-print"></i></a>
            <a (click)="DeleteMedicalHistory(record)" class="m-2 h4" style="color: #f3c93e;cursor: pointer !important;"><i
                class="fa-solid fa-trash"></i></a>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="mx-auto mb-3 text-center d-flex align-items-center justify-content-center" *ngIf="countOfPage>1">
      <button class="btn  btn-outline-primary mx-3" (click)="getpages(1)">
        <i class="fa-solid fa-angles-left"></i>
      </button>
      <button class="btn  btn-outline-primary me-3" (click)="gotleft()">
        <i class="fa-solid fa-angle-left"></i>
      </button>

      <div class="me-3">{{indexofPages}} of {{countOfPage}}</div>

      <button class="btn  btn-outline-primary me-3" (click)="gotoright()">
        <i class="fa-solid fa-angle-right"></i>
      </button>
      <button class="btn  btn-outline-primary me-3" (click)="getpages(countOfPage)">
        <i class="fa-solid fa-angles-right"></i>
      </button>
    </div>
  </div>
