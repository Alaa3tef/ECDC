<div class="container mb-5" style="margin-top: 8%;">
  <div class="heading_container heading_center text-center">
    <h2 class="my-4">
      Stop Cards
    </h2>
  </div>

  <div class="row my-4">
    <div class="col-12 col-md-3 mb-2 mb-md-0">
      <a routerLink="/StopCard" class="btn btn-primary w-100">Add New Stop Card</a>
    </div>
    <div class="col-12 col-md-3 mb-2 mb-md-0">
      <a (click)="Download()" class="btn btn-primary w-100">Export Data</a>
    </div>
    <div class="col-12 col-md-6">
      <input list="Search" autocomplete="off" name="menace" class="form-control" placeholder="Search" (input)="selectedMenace($event)">
      <datalist id="Search">
        <option *ngFor="let menace of SearchList">{{menace}} </option>
      </datalist>
    </div>
  </div>

  <table class="table table-striped text-center mt-2">
    <thead>
      <tr>
        <th>Date</th>
        <th>User Name</th>
        <th>Classification</th>
        <th>Description</th>
        <th>Status</th>
        <th *ngIf="IsAdmin || IsUser" style="width: 15%;">Actions</th>
      </tr>
    </thead>
    <tbody *ngFor="let record of (stopCardList | async)">
      <tr>
        <td>{{record.date | date: 'dd-MM-yyyy'}}</td>
        <td>{{record.userName}}</td>
        <td>{{record.classification}}</td>
        <td>
          {{record.description}}
        </td>
        <td>{{record.status}}</td>
        <td *ngIf="IsAdmin || IsUser">
          <a routerLink="/StopCard/Edit/{{record.id}}/{{record.date}}" class="m-2 h4" style="color: #434F78;">
            <i class="fa-solid fa-pen-to-square"></i>
          </a>
          <a routerLink="/PrintStopCardById/{{record.id}}" class="m-2 h4" style="color: #434F78;">
            <i class="fa-solid fa-print"></i>
          </a>
          <a (click)="DeleteStopCard(record)" class="m-2 h4" style="color: #f3c93e; cursor: pointer !important;">
            <i class="fa-solid fa-trash"></i>
          </a>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="d-flex justify-content-center align-items-center my-3" *ngIf="countOfPage > 1">
    <button class="btn btn-outline-primary mx-1" (click)="getpages(1)">
      <i class="fa-solid fa-angles-left"></i>
    </button>
    <button class="btn btn-outline-primary mx-1" (click)="gotleft()">
      <i class="fa-solid fa-angle-left"></i>
    </button>
    <div class="mx-2">{{indexofPages}} of {{countOfPage}}</div>
    <button class="btn btn-outline-primary mx-1" (click)="gotoright()">
      <i class="fa-solid fa-angle-right"></i>
    </button>
    <button class="btn btn-outline-primary mx-1" (click)="getpages(countOfPage)">
      <i class="fa-solid fa-angles-right"></i>
    </button>
  </div>
</div>
