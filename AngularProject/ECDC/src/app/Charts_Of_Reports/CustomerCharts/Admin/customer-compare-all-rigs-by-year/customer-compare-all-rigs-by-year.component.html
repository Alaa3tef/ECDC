<div class="container" style="margin: 8% 0; min-height: 63vh;">
  <div class="heading_container heading_center d-flex">
    <h2 class="mx-auto my-4">
      Customer Satisfaction Evaluation With Compare All Rigs By Year
    </h2>

  </div>
  <div class="mb-5">
    <label for="year" class="form-label">Year</label>
    <select name="year" id="year" class="form-select" (change)="onChange($event)">
      <option value="" disabled selected>Choose Year</option>
      <option value="{{item}}" *ngFor="let item of YearsList">{{item}}</option>

    </select>
  </div>

  <div id="divChart" #divChart *ngIf="temp">
    <div class="mb-5" id="chart1">
      <canvas id="myChart"></canvas>
    </div>


    <!-- your.component.html -->
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Rig Number</th>
          <th>Evaluation Result(s)</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of pushingList">
          <td>Rig-{{ row[0].rigNumber }}</td>
          <td>
            <ul>
              <li *ngFor="let result of row">The Result: {{ result.evaluationResult }} / During The Month:
                {{result.month}}</li>
            </ul>
          </td>
        </tr>
      </tbody>
    </table>

    <div style="width: 80%; margin: auto;">
      <canvas #myChartCanvas width="400" height="200"></canvas>
    </div>
  </div>
</div>
